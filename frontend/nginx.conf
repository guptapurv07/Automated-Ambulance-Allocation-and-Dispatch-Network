# How the dashboard's container answers (see Dockerfile):
#
#   /api/...       handed to the dispatch server (the `app` service) with /api taken off, so
#                  /api/ambulances becomes /ambulances: what the dev server does on the laptop
#   /assets/...    the built scripts, styles and fonts. Their names change with every build,
#                  so the browser may keep them for a year.
#   anything else  the file if there is one (roads.json), otherwise index.html, so that a page
#                  opened directly, such as /fleet or /incidents/12, loads the dashboard

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # roads.json is 2 MB; compressed it is a fraction of that.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's own name server. With the address in a variable, `app` is looked up when a request
    # comes, not once at start: the dashboard starts even while the server is down, and finds it
    # again after the server restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $dispatch_server http://app:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $dispatch_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
